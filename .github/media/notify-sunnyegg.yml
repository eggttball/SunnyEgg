name: Update SunnyEgg website
on:
  push:
    branches: [main]
    paths: ['photos/**', 'manifest.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Dispatch to the code repo: all deployments share its concurrency group.
      - name: Trigger the SunnyEgg deployment
        env:
          GH_TOKEN: ${{ secrets.SUNNYEGG_REPO_TOKEN }}
        run: gh workflow run firebase-deploy.yml --repo eggttball/SunnyEgg --ref main
